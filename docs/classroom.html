<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f6"><title>demo</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div><div id="toast" role="status"></div><div id="popover" class="popover" hidden></div><dialog id="uploadDialog"><div class="dialog-head"><div><span class="eyebrow">BEFORE CLASS</span><h2>先把课件放进来</h2></div><button class="icon-btn close-dialog" aria-label="关闭">×</button></div><p class="muted">课件、讲解和你的笔记，在同一个地方。</p><label class="dropzone" id="dropzone"><div class="upload-symbol">↥</div><strong>拖入课件，或点击选择</strong><span>PDF、PPTX · 也支持多份上传</span><input id="courseInput" type="file" accept=".pdf,.pptx" multiple hidden></label><div id="uploadProgress" role="status"></div><div class="privacy-line">文件在当前浏览器处理和保存。此原型不会把课件上传到 AI。</div><button class="button secondary wide close-dialog">返回课堂</button></dialog><dialog id="recordDialog"><div class="dialog-head"><div><span class="eyebrow">A NEW SESSION</span><h2>留下这一刻的讲解</h2></div><button class="icon-btn close-dialog" aria-label="关闭">×</button></div><p class="muted">只记录声音，给理解留出空间。</p><button class="record-choice" id="micRecord"><span class="choice-icon">●</span><span><strong>使用麦克风录音</strong><small>录制并保存在浏览器，可回放和下载</small></span><span>↗</span></button><label class="record-choice"><span class="choice-icon">↥</span><span><strong>导入已有录音</strong><small>支持浏览器可播放的音频文件</small></span><span>↗</span><input id="audioInput" type="file" accept="audio/*" hidden></label><p class="privacy-line">真实录音已可用；自动转写、翻译和 AI 总结尚未接入服务。示例课程提供完整的 AI 交互演示。</p><button class="button secondary wide" id="demoChoice">先体验示例课堂</button></dialog><dialog id="settingsDialog"><div class="dialog-head"><h2>课堂设置</h2><button class="icon-btn close-dialog" aria-label="关闭">×</button></div><label class="field-label">录音语言<select id="languageSetting"><option>English · 英语</option></select></label><label class="field-label">口音偏好<select id="accentSetting"><option value="auto">自动识别</option><option value="us">美式英语</option><option value="uk">英式英语</option><option value="it">意大利口音英语</option><option value="in">印度口音英语</option><option value="ar">阿拉伯口音英语</option></select></label><p class="privacy-line">口音偏好会保留在本机。当前原型尚未接入对应的语音识别模型。</p><button class="button primary wide" id="saveSettings">保存设置</button></dialog><script src="vendor/pdf.min.js"></script><script src="vendor/fflate.js"></script><script src="demo-data.js"></script><script src="app.js"></script><script src="translate.js"></script></body></html>
